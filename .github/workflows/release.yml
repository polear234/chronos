name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. 测试 ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # ── 2. 交叉编译六平台二进制 ──────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^VERSION *:=' Makefile | sed 's/.*:= *//')"
          fi
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/chronos-${GOOS}-${GOARCH}${EXT}" .
          ls -lh dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  # ── 3. Windows: MSI 安装包（自动写 PATH）+ 便携 ZIP ──────
  package-windows:
    needs: build
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin-windows-${{ matrix.arch }}
          path: dist

      - name: Locate WiX Toolset
        id: wix
        shell: pwsh
        run: |
          $c = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue |
               Select-Object -First 1
          if (-not $c) {
            Write-Host "预装 WiX 未找到，改用 Chocolatey 安装"
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $c = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" |
                 Select-Object -First 1
          }
          "bin=$($c.DirectoryName)" >> $env:GITHUB_OUTPUT
          Write-Host "WiX: $($c.DirectoryName)"

      - name: Build MSI
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $VERSION = ((Select-String -Path Makefile -Pattern '^VERSION\s*:=').Line -split ':=')[1].Trim()
          }
          $wix = "${{ steps.wix.outputs.bin }}"
          $src = "$PWD\dist\chronos-windows-${{ matrix.arch }}.exe"
          New-Item -ItemType Directory -Force -Path obj | Out-Null
          # WiX v3 的 -d 变量名区分大小写，需与 .wxs 中的 $(var.source)/$(var.version) 一致
          & "$wix\candle.exe" -dsource="$src" -dversion="$VERSION" `
            -darch="${{ matrix.arch }}" `
            -out "obj\chronos-${{ matrix.arch }}.wixobj" scripts/msi/chronos.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle 失败" }
          & "$wix\light.exe" `
            -out "dist/chronos-$VERSION-windows-${{ matrix.arch }}.msi" `
            "obj\chronos-${{ matrix.arch }}.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light 失败" }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $VERSION = ((Select-String -Path Makefile -Pattern '^VERSION\s*:=').Line -split ':=')[1].Trim()
          }
          $tmp = "portable"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item "dist/chronos-windows-${{ matrix.arch }}.exe" "$tmp/chronos.exe"
          Copy-Item README.md, LICENSE "$tmp/"
          if (Test-Path examples) { Copy-Item examples "$tmp/examples" -Recurse }
          Compress-Archive -Path "$tmp/*" `
            -DestinationPath "dist/chronos-$VERSION-windows-${{ matrix.arch }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.zip
          retention-days: 7

  # ── 4. Linux: deb 安装包 ────────────────────────────────
  package-deb:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-${{ matrix.arch }}
          path: dist

      - name: Build deb
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^VERSION *:=' Makefile | sed 's/.*:= *//')"
          fi
          ARCH="${{ matrix.arch }}"
          PKG="$(mktemp -d)"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/local/bin"
          cp "dist/chronos-linux-$ARCH" "$PKG/usr/local/bin/chronos"
          chmod 755 "$PKG/usr/local/bin/chronos"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: chronos
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: $ARCH
          Maintainer: Chronos Contributors <chronos@example.com>
          Depends: libc6
          Description: Chronos - a lightweight scripting language
           Lightweight dynamically-typed scripting language implemented in Go.
           Features variable time-travel (rollback), transactional snapshots,
           pipe operator, classes with inheritance, and a module system.
          EOF
          dpkg-deb --build --root-owner-group "$PKG" \
            "dist/chronos_${VERSION}_${ARCH}.deb"
          rm -rf "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 7

  # ── 5. Android: IDE APK（WebView + WASM + 打包器） ──────
  package-android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Read version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -E '^VERSION *:=' Makefile | sed 's/.*:= *//')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build WASM runtime
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" \
            -o android/app/src/main/assets/chronos.wasm .

      - name: Build SH kernel (arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o android/app/src/main/assets/chronos-linux-arm64 .

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "::group::现有 SDK 组件"
          ls "$SDK" 2>/dev/null || echo "SDK 目录不存在"
          ls "$SDK/build-tools/" 2>/dev/null || echo "无 build-tools"
          ls "$SDK/platforms/" 2>/dev/null || echo "无 platforms"
          echo "::endgroup::"

          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -10 || true
          fi

          echo "::group::安装后"
          ls "$SDK/build-tools/" 2>/dev/null || echo "无 build-tools"
          ls "$SDK/platforms/" 2>/dev/null || echo "无 platforms"
          echo "::endgroup::"

          # 必须装到 34.0.0（D8 处理 apksig 已验证可用；更高版本有内部 NPE）
          if [ ! -d "$SDK/build-tools/34.0.0" ]; then
            echo "::error::build-tools 34.0.0 未安装成功（更高版本的 D8 无法处理 apksig）"
            exit 1
          fi
          if [ -z "$(ls "$SDK"/platforms/android-*/android.jar 2>/dev/null)" ]; then
            echo "::error::platform android.jar 缺失"; exit 1
          fi

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/chronos.keystore
            echo "✓ 使用 Secrets 中的签名密钥"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 —— 将生成临时密钥，产出 APK 无法覆盖升级"
          fi

      - name: Sync version into manifests
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$V\"/" \
            android/app/src/main/AndroidManifest.xml \
            android/template/AndroidManifest.xml || true

      - name: Build template APK
        run: |
          chmod +x android/build-apk.sh
          ./android/build-apk.sh --template /tmp/template.apk

      - name: Build IDE APK
        run: |
          cp /tmp/template.apk android/app/src/main/assets/template.apk
          mkdir -p dist
          ./android/build-apk.sh "dist/chronos-ide-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-android
          path: dist/*.apk
          retention-days: 7

  # ── 6. 汇总发布 ─────────────────────────────────────────
  release:
    needs: [ build, package-windows, package-deb, package-android ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notes
        run: |
          {
            printf 'Chronos %s\n\n' "$GITHUB_REF_NAME"
            printf '用 Go 手写的轻量脚本语言：变量时间旅行 `rollback()`、`withSnapshot`、管道 `|>`、类继承、模式匹配、import 模块。\n\n'
            printf '### 下载\n\n'
            printf '| 平台 | 文件 |\n|---|---|\n'
            for f in dist/chronos-* dist/*.deb; do
              case "$f" in *SHA256*) continue;; esac
              [ -f "$f" ] || continue
              printf '| %s | `%s` |\n' "$(basename "$f")" "$(basename "$f")"
            done
            printf '\n### 快速开始\n\n'
            printf '**Windows**：下载 `.msi` 双击安装（自动加入 PATH），或 `.zip` 解压即用。\n\n'
            printf '```bash\n'
            printf 'chmod +x chronos-linux-arm64\n'
            printf './chronos-linux-arm64 run examples/hello.chr\n'
            printf './chronos-linux-arm64          # 进入 REPL\n'
            printf '```\n\n'
            printf '单文件静态二进制，无运行时依赖。校验和见 `SHA256SUMS.txt`。\n'
          } > NOTES.md
          cat NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Chronos $GITHUB_REF_NAME" \
              --notes-file NOTES.md
          fi
