name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="0.1.0"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          OUT="chronos-${GOOS}-${GOARCH}${EXT}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$OUT" .
          ls -lh "dist/$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chronos-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notes
        run: |
          {
            printf 'Chronos %s\n\n' "$GITHUB_REF_NAME"
            printf '用 Go 手写的轻量脚本语言：变量时间旅行 `rollback()`、`withSnapshot`、管道 `|>`、数组方法链、类继承、模式匹配、import 模块。\n\n'
            printf '### 下载\n\n'
            printf '| 平台 | 文件 |\n|---|---|\n'
            for f in dist/chronos-*; do
              case "$f" in *SHA256*) continue;; esac
              printf '| %s | `%s` |\n' "$(basename "$f")" "$(basename "$f")"
            done
            printf '\n### 快速开始\n\n'
            printf '```bash\n'
            printf 'chmod +x chronos-linux-arm64\n'
            printf './chronos-linux-arm64 run examples/hello.px\n'
            printf './chronos-linux-arm64          # 进入 REPL\n'
            printf '```\n\n'
            printf '单文件静态二进制，无运行时依赖。校验和见 `SHA256SUMS.txt`。\n'
          } > NOTES.md
          cat NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Chronos $GITHUB_REF_NAME" \
              --notes-file NOTES.md
          fi