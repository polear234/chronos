<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Chronos IDE</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --accent:#3ddcae;
    --accent-dim:#2a9d8f; --err:#ff7b72; --ok:#3fb950;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--border);flex:0 0 auto;
  }
  header .logo{width:26px;height:26px;flex:0 0 auto}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .ver{font-size:11px;color:var(--dim);margin-left:2px}
  header .spacer{flex:1}
  #runBtn{
    background:var(--accent);color:#04120e;border:0;border-radius:8px;
    padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  #runBtn:active{transform:scale(.96)}
  #runBtn:disabled{opacity:.45}
  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .pane{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .pane + .pane{border-top:1px solid var(--border)}
  .pane-bar{
    display:flex;align-items:center;gap:8px;padding:6px 12px;
    background:var(--panel);border-bottom:1px solid var(--border);
    font-size:12px;color:var(--dim);flex:0 0 auto;
  }
  .pane-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .pane-bar .spacer{flex:1}
  .filerow{
    display:flex;align-items:center;gap:6px;padding:5px 10px;
    background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto;
  }
  .filerow select{
    flex:0 0 auto;min-width:110px;max-width:45%;
    background:var(--bg);color:var(--fg);border:1px solid var(--border);
    border-radius:6px;padding:4px 6px;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .filerow button{
    background:transparent;color:var(--accent);border:1px solid var(--border);
    border-radius:6px;width:26px;height:26px;font-size:15px;line-height:1;
    cursor:pointer;flex:0 0 auto;padding:0;
  }
  .filerow button:active{background:var(--border)}
  .filerow .fhint{font-size:11px;color:var(--dim);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  textarea{
    flex:1;width:100%;resize:none;border:0;outline:0;
    background:var(--bg);color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:14px;line-height:1.55;padding:12px 14px;
    tab-size:2;caret-color:var(--accent);
  }
  #out{
    flex:1;margin:0;padding:12px 14px;overflow:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
    background:var(--bg);
  }
  #out .err{color:var(--err)}
  #out .ok{color:var(--ok)}
  #out .dim{color:var(--dim)}
  footer{
    display:flex;gap:8px;padding:8px 12px;background:var(--panel);
    border-top:1px solid var(--border);flex:0 0 auto;overflow-x:auto;
  }
  footer button{
    background:transparent;color:var(--dim);border:1px solid var(--border);
    border-radius:7px;padding:7px 12px;font-size:12px;white-space:nowrap;cursor:pointer;
  }
  footer button:active{background:var(--border)}
  .pkgrow{
    display:flex;align-items:center;gap:8px;padding:6px 12px;
    background:var(--panel);border-top:1px solid var(--border);flex:0 0 auto;
    font-size:12px;color:var(--dim);
  }
  .pkgrow input{
    flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;
    color:var(--fg);padding:6px 8px;font-size:12px;
    font-family:ui-monospace,Menlo,monospace;
  }
  /* ===== 运行模式：编译产物只显示输出 ===== */
  body.runtime header{justify-content:center;gap:8px}
  body.runtime header .ver,
  body.runtime #runBtn,
  body.runtime .pkgrow,
  body.runtime footer,
  body.runtime .pane-bar,
  body.runtime .pane:first-of-type,
  body.runtime #status{display:none !important}
  body.runtime main{padding:0}
  body.runtime #out{
    font-size:15px;line-height:1.7;padding:22px 20px;
    color:var(--fg);
  }
  body.runtime #out .err{color:var(--err)}
  .status{
    font-size:11px;color:var(--dim);padding:3px 12px 6px;
    background:var(--panel);flex:0 0 auto;
  }
  .status b{color:var(--accent)}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 100 100" aria-label="Chronos">
    <path d="M 75 22 A 35 35 0 1 0 75 78" fill="none"
          stroke="#FFCC00" stroke-width="12" stroke-linecap="round"/>
    <path d="M 66 33 L 48 50 L 66 67" fill="none"
          stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Chronos IDE</h1>
  <span class="ver" id="ver">加载中…</span>
  <div class="spacer"></div>
  <button id="runBtn" disabled>▶ 运行</button>
</header>

<main>
  <section class="pane">
    <div class="pane-bar"><span class="dot"></span><span id="fname">main.chr</span> <span class="spacer"></span><span id="lines">0 行</span></div>
    <div class="filerow">
      <select id="fileSel" title="切换文件"></select>
      <button id="newFileBtn" title="新建文件">＋</button>
      <button id="delFileBtn" title="删除当前文件">－</button>
      <span id="fileHint" class="fhint">单文件运行时无需 import</span>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="在这里写 Chronos 代码…"></textarea>
  </section>
  <section class="pane">
    <div class="pane-bar"><span class="dot" style="background:var(--ok)"></span>输出 <span class="spacer"></span>
      <span id="timing"></span>
    </div>
    <pre id="out"><span class="dim">按「运行」执行代码</span></pre>
  </section>
</main>

<div class="pkgrow">
  <span>包名</span>
  <input id="pkgName" spellcheck="false" autocapitalize="off" autocorrect="off"
         value="com.chronos.script" placeholder="com.example.myapp">
</div>

<footer>
  <button id="importBtn" style="color:var(--accent);border-color:var(--accent-dim)">⬇ 导入</button>
  <button id="exportBtn" style="color:var(--accent);border-color:var(--accent-dim)">⬆ 导出</button>
  <button id="apkBtn" style="color:#ffd166;border-color:#8a6d1f">📦 打包 APK</button>
  <button id="shBtn" style="color:#a5d6ff;border-color:#2f5d8a">🐚 编译 SH</button>
  <button id="exHello">示例：Hello</button>
  <button id="exTravel">示例：时间旅行</button>
  <button id="exOOP">示例：类继承</button>
  <button id="exPipe">示例：管道</button>
  <button id="clearBtn">清空输出</button>
  <button id="clearCode">清空代码</button>
</footer>
<div class="status" id="status">正在加载 WASM 运行时…</div>

<script src="wasm_exec.js"></script>
<script>
"use strict";

const codeEl   = document.getElementById('code');
const outEl    = document.getElementById('out');
const runBtn   = document.getElementById('runBtn');
const verEl    = document.getElementById('ver');
const statusEl = document.getElementById('status');
const linesEl  = document.getElementById('lines');
const timingEl = document.getElementById('timing');

let ready = false;

const SAMPLES = {
hello: `print("Hello, Chronos!")

let name = "世界"
print("你好，" + name)

fn fib(n) {
    if n <= 1 { return n }
    return fib(n - 1) + fib(n - 2)
}
print("fib(10) = " + str(fib(10)))`,

travel: `// 🕐 变量时间旅行
let traveller int hp = 100
print("初始血量: " + str(hp))

hp = 50
print("受伤后: " + str(hp))

hp.rollback()
print("时光倒流: " + str(hp))

// 🔄 事务性快照
let arr = [1, 2, 3]
withSnapshot([arr], fn() {
    arr.push(99)
})
print("快照恢复后: " + str(arr))`,

oop: `class 动物 {
    name = ""
    init(n) { this.name = n }
    speak() { return this.name + " 发出叫声" }
}

class 狗 extends 动物 {
    speak() { return this.name + " 汪汪叫！" }
}

let d = new 狗("旺财")
print(d.speak())`,

pipe: `// ⛓️ 管道操作符
let nums = [1, 2, 3, 4, 5]

let n = nums |> len()
print("长度: " + str(n))

let doubled = nums |> map(fn(x) { x * 2 })
print("翻倍: " + str(doubled))

let evens = nums |> filter(fn(x) { x % 2 == 0 })
print("偶数: " + str(evens))`
};

// ---- 虚拟文件系统：多文件编辑 + import 支持 ----
// 结构: { "main.chr": "源码", "lib.chr": "源码" }
const FS_KEY = 'chronos.files';
const FS_CUR = 'chronos.cur';
let files = {};
let curName = 'main.chr';

function loadFiles(){
  try {
    const raw = localStorage.getItem(FS_KEY);
    files = raw ? JSON.parse(raw) : {};
  } catch (e) { files = {}; }
  // 过滤非法文件名：只保留 .chr / .px 结尾，避免历史脏数据（如 "下载.svg"）
  const valid = {};
  for (const k of Object.keys(files)) {
    if (/\.(chr|px)$/i.test(k)) valid[k] = files[k];
  }
  files = valid;
  // 兼容旧版单文件存储
  if (Object.keys(files).length === 0) {
    const old = localStorage.getItem('chronos.code');
    let oldName = localStorage.getItem('chronos.name') || 'main.chr';
    if (!/\.(chr|px)$/i.test(oldName)) oldName = 'main.chr';
    files[oldName] = old || SAMPLES.hello;
  }
  const savedCur = localStorage.getItem(FS_CUR);
  curName = (savedCur && files[savedCur]) ? savedCur : Object.keys(files)[0];
}

function saveFiles(){
  localStorage.setItem(FS_KEY, JSON.stringify(files));
  localStorage.setItem(FS_CUR, curName);
  // 同步到 WASM 虚拟文件表，供 import 使用
  window.chronosFiles = files;
}

const fnameEl = document.getElementById('fname');
const fileSel = document.getElementById('fileSel');
const fileHint = document.getElementById('fileHint');

function setFileName(n){
  if (!n) return;
  curName = n;
  fnameEl.textContent = curName;
  saveFiles();
  refreshFileSel();
}

function refreshFileSel(){
  const names = Object.keys(files).sort();
  fileSel.innerHTML = '';
  names.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    if (n === curName) o.selected = true;
    fileSel.appendChild(o);
  });
  // 提示当前文件是否被别处 import
  const others = names.filter(n => n !== curName && files[n].includes(curName.replace(/\.(chr|px)$/, '')));
  fileHint.textContent = others.length
    ? '被 ' + others.join(', ') + ' 引用'
    : (names.length > 1 ? '可 import: ' + names.filter(n=>n!==curName).map(n=>n.replace(/\.(chr|px)$/,'')).join(', ') : '单文件运行时无需 import');
}

function switchFile(n){
  if (!files[n]) return;
  // 保存当前
  files[curName] = codeEl.value;
  curName = n;
  codeEl.value = files[n];
  setFileName(n);
  updateLines();
}

function newFile(){
  let base = 'lib', n = base + '.chr', i = 1;
  while (files[n]) { n = base + i + '.chr'; i++; }
  files[curName] = codeEl.value;
  files[n] = '// ' + n + '\n';
  switchFile(n);
  statusEl.innerHTML = '已新建 <b>' + n + '</b>';
}

function delFile(){
  const names = Object.keys(files);
  if (names.length <= 1) {
    statusEl.innerHTML = '<span style="color:var(--err)">至少保留一个文件</span>';
    return;
  }
  if (!confirm('删除 ' + curName + ' ?')) return;
  delete files[curName];
  const next = Object.keys(files).sort()[0];
  curName = next;
  codeEl.value = files[next];
  setFileName(next);
  updateLines();
  statusEl.innerHTML = '已删除，切换到 <b>' + next + '</b>';
}

loadFiles();
setFileName(curName);

// ---- 导入 / 导出（Android 桥）----
const bridge = window.ChronosBridge;
const pkgEl = document.getElementById('pkgName');
{
  const savedPkg = localStorage.getItem('chronos.pkg');
  if (savedPkg) pkgEl.value = savedPkg;
  pkgEl.addEventListener('input', () => localStorage.setItem('chronos.pkg', pkgEl.value.trim()));
}

document.getElementById('importBtn').addEventListener('click', () => {
  if (bridge && bridge.pickFile) {
    bridge.pickFile();
  } else {
    alert('导入功能仅在 Android App 内可用');
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const name = (curName.endsWith('.chr') || curName.endsWith('.px')) ? curName : (curName + '.chr');
  if (bridge && bridge.saveFile) {
    bridge.saveFile(name, codeEl.value);
  } else {
    // 浏览器回退：直接下载
    const blob = new Blob([codeEl.value], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
});

// 编译前语法检查：像 C++ 一样，语法错误直接拒绝，不产出可执行文件
function syntaxCheck(label) {
  if (typeof chronosCheck !== 'function' || !ready) {
    statusEl.innerHTML = '<span style="color:var(--err)">✗ ' + label + '失败：运行时尚未就绪</span>';
    return false;
  }
  let r;
  try {
    r = JSON.parse(chronosCheck(codeEl.value));
  } catch (e) {
    statusEl.innerHTML = '<span style="color:var(--err)">✗ ' + label + '失败：检查异常 ' + escapeHtml(String(e)) + '</span>';
    return false;
  }
  if (!r.ok) {
    const lines = (r.errors || [r.error]).filter(Boolean).join('\n');
    outEl.innerHTML = '<span class="err">编译错误（共 ' + (r.count || 1) + ' 处）：\n' + escapeHtml(lines) + '\n\n已拒绝' + label + '，请先修复语法错误。</span>';
    statusEl.innerHTML = '<span style="color:var(--err)">✗ 语法错误，已拒绝' + label + '</span>';
    return false;
  }
  statusEl.innerHTML = '语法检查通过，正在' + label + '…';
  return true;
}

// 打包为 APK（弹出自定义选项）
document.getElementById('apkBtn').addEventListener('click', () => {
  if (!(bridge && bridge.compileApk)) {
    alert('打包功能仅在 Android App 内可用');
    return;
  }
  openApkModal();
});

// 编译为 shell 脚本
document.getElementById('shBtn').addEventListener('click', () => {
  if (!(bridge && bridge.compileShell)) {
    alert('编译 SH 仅在 Android App 内可用');
    return;
  }
  // 用了 ui 模块的脚本不能编译成 SH（终端里没有图形界面）
  if (/import\s+[\"']ui[\"']/.test(codeEl.value) || /\bui\.(title|text|button|input|show)\s*\(/.test(codeEl.value)) {
    alert('这个脚本使用了 ui 模块，无法编译成 SH。\n\n' +
          'SH 脚本运行在终端里，没有图形界面。\n' +
          '请用「打包 APK」把它做成应用，或去掉 ui 相关代码。');
    return;
  }
  if (!syntaxCheck('生成 SH')) return;
  bridge.compileShell(curName, codeEl.value);
});

window.onShellResult = function(ok, msg) {
  statusEl.innerHTML = ok
    ? '✓ ' + msg
    : '<span style="color:var(--err)">✗ ' + msg + '</span>';
};

// Android 侧打包结果回调
window.onApkResult = function(ok, msg) {
  statusEl.innerHTML = ok
    ? '✓ ' + msg
    : '<span style="color:var(--err)">✗ ' + msg + '</span>';
};

// Android 侧导入完成后的回调
window.onFileImported = function(name, content) {
  files[curName] = codeEl.value;
  files[name] = content;
  curName = name;
  codeEl.value = content;
  setFileName(name);
  updateLines();
  statusEl.innerHTML = '已导入 <b>' + name + '</b>';
  outEl.innerHTML = '<span class="dim">已导入 ' + name + '，点「运行」执行</span>';
};

// 恢复上次代码（内嵌脚本优先）
codeEl.value = files[curName] || SAMPLES.hello;
window.chronosFiles = files;

// ===== 编译产物检测：有 assets/script.chr（或旧版 script.px）就进入「运行模式」 =====
let pendingRuntime = null;
(async () => {
  for (const name of ['script.chr', 'script.px']) {
    try {
      const r = await fetch(name);
      if (r.ok) {
        const t = await r.text();
        if (t && t.trim().length > 0) {
          pendingRuntime = t;
          enterRuntimeMode(t);
          return;
        }
      }
    } catch (e) { /* 非编译产物 */ }
  }
})();

function enterRuntimeMode(code) {
  document.body.classList.add('runtime');
  codeEl.value = code;
  document.title = 'Chronos';
  const h = document.querySelector('header h1');
  if (h) h.textContent = 'Chronos';
  outEl.innerHTML = '<span class="dim">正在运行…</span>';
}

function updateLines(){
  const n = codeEl.value ? codeEl.value.split('\n').length : 0;
  linesEl.textContent = n + ' 行';
}
updateLines();

codeEl.addEventListener('input', () => {
  updateLines();
  files[curName] = codeEl.value;
  saveFiles();
});

// ---- WASM 加载 ----
window.onChronosReady = function(version){
  ready = true;
  runBtn.disabled = false;
  verEl.textContent = 'v' + version.replace('Chronos ', '');
  statusEl.innerHTML = '运行时已就绪 · <b>' + version + '</b>';
  // 运行模式：就绪后立即执行
  if (pendingRuntime !== null) {
    runCode();
  }
};

(async () => {
  try {
    const go = new Go();
    const resp = await fetch('chronos.wasm');
    const bytes = await resp.arrayBuffer();
    const mod = await WebAssembly.instantiate(bytes, go.importObject);
    go.run(mod.instance);          // 内部 main() 会阻塞，不 await
    setTimeout(() => {
      if (!ready) statusEl.textContent = '运行时启动失败：未收到就绪回调';
    }, 3000);
  } catch (e) {
    statusEl.textContent = 'WASM 加载失败: ' + e;
    outEl.innerHTML = '<span class="err">WASM 加载失败: ' + e + '</span>';
  }
})();

// ---- 运行 ----
function runCode(){
  if (!ready) return;
  const t0 = performance.now();
  let res;
  try {
    res = JSON.parse(chronosRun(codeEl.value));
  } catch (e) {
    outEl.innerHTML = '<span class="err">运行时异常: ' + e + '</span>';
    return;
  }
  const ms = (performance.now() - t0).toFixed(1);
  timingEl.textContent = ms + ' ms';

  // 检测是否是 UI HTML 输出
  if (res.ui && res.ui.length > 0) {
    showUiScreen(res.ui);
    outEl.innerHTML = '<span class="dim">UI 已渲染（点右下角 ✕ 关闭）</span>';
    return;
  }

  let html = '';
  if (res.output) html += escapeHtml(res.output);
  if (res.error) {
    if (html && !html.endsWith('\n')) html += '\n';
    html += '<span class="err">' + escapeHtml(res.error) + '</span>';
  }
  if (!html) html = '<span class="dim">（无输出）</span>';
  outEl.innerHTML = html;
  outEl.scrollTop = outEl.scrollHeight;
}

// 显示全屏 UI（用 iframe 隔离）
function showUiScreen(html) {
  const frame = document.getElementById('uiFrame');
  document.getElementById('uiScreen').style.display = 'block';
  // 注入 UI 回调桥
  const bridge = `
<script>
function chronosCallback(id, value) {
  parent.postMessage({type:'chronosUI', id:id, value:value}, '*');
}
<\/script>`;
  frame.srcdoc = html.replace('</head>', bridge + '</head>');
}

function closeUiScreen() {
  document.getElementById('uiScreen').style.display = 'none';
  document.getElementById('uiFrame').srcdoc = '';
}

// UI 回调转发给 WASM，并把新 HTML 推回 iframe
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'chronosUI') {
    try {
      if (typeof chronosUICallback === 'function') {
        const newHtml = chronosUICallback(e.data.id, e.data.value);
        if (newHtml && newHtml.length > 0) {
          showUiScreen(newHtml);   // 重绘
        }
      }
    } catch (err) { console.error('UI callback error:', err); }
  }
});

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

runBtn.addEventListener('click', runCode);

// ---- 示例 / 工具 ----
const bind = (id, sample) => document.getElementById(id).addEventListener('click', () => {
  codeEl.value = SAMPLES[sample];
  files[curName] = codeEl.value;
  saveFiles();
  updateLines();
  runCode();
});
bind('exHello','hello'); bind('exTravel','travel'); bind('exOOP','oop'); bind('exPipe','pipe');

// ---- 文件栏 ----
fileSel.addEventListener('change', () => switchFile(fileSel.value));
document.getElementById('newFileBtn').addEventListener('click', newFile);
document.getElementById('delFileBtn').addEventListener('click', delFile);

document.getElementById('clearBtn').addEventListener('click', () => {
  outEl.innerHTML = '<span class="dim">（已清空）</span>';

document.getElementById('clearCode').addEventListener('click', () => {

  files[curName] = '';
  saveFiles();
  updateLines();
  outEl.innerHTML = '<span class="dim">（已清空）</span>';
});

// ===== 编辑器增强：自动缩进 / 括号补全 / 智能换行 =====
const INDENT = '  '; // 两级缩进

function setCode(value, caret) {
  codeEl.value = value;
  codeEl.selectionStart = codeEl.selectionEnd = caret;
  files[curName] = value;
  saveFiles();
  updateLines();
}

// 当前行行首到光标之间的文本
function linePrefixBefore(pos) {
  const ls = codeEl.value.lastIndexOf('\n', pos - 1) + 1;
  return codeEl.value.slice(ls, pos);
}

codeEl.addEventListener('keydown', (e) => {
  const s = codeEl.selectionStart, en = codeEl.selectionEnd;
  const v = codeEl.value;
  const selected = s !== en;

  // ---- Tab：选中多行整体缩进；Shift+Tab 反缩进；否则插入缩进 ----
  if (e.key === 'Tab') {
    e.preventDefault();
    if (selected) {
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const le = v.indexOf('\n', en);
      const end = le === -1 ? v.length : le;
      const block = v.slice(ls, end);
      const lines = block.split('\n');
      if (e.shiftKey) {
        const shifted = lines.map(line => line.startsWith(INDENT) ? line.slice(INDENT.length) : line.replace(/^\t/, '')).join('\n');
        setCode(v.slice(0, ls) + shifted + v.slice(end), s);
      } else {
        const shifted = lines.map(line => INDENT + line).join('\n');
        setCode(v.slice(0, ls) + shifted + v.slice(end), s + INDENT.length);
      }
    } else {
      if (e.shiftKey) {
        // 行首反缩进
        const ls = v.lastIndexOf('\n', s - 1) + 1;
        const line = v.slice(ls, s);
        if (line.startsWith(INDENT)) {
          setCode(v.slice(0, ls) + line.slice(INDENT.length) + v.slice(s), Math.max(ls, s - INDENT.length));
        }
      } else {
        setCode(v.slice(0, s) + INDENT + v.slice(en), s + INDENT.length);
      }
    }
    return;
  }

  // ---- 换行：保持缩进，{ 后多缩进一级，} 前回退一级 ----
  if (e.key === 'Enter') {
    e.preventDefault();
    const prefix = linePrefixBefore(s);
    let indent = (prefix.match(/^[ \t]*/) || [''])[0];
    const trimmed = prefix.trimEnd();
    // 行尾是 { [ ( 或 : —— 增加一级
    if (/[{[(:]$/.test(trimmed)) indent += INDENT;
    // 光标后紧跟 } ] ) —— 多插入一个缩进并把闭合符顶到下一行
    const nextCh = v.slice(en, en + 1);
    let extra = '';
    if ((nextCh === '}' || nextCh === ']' || nextCh === ')') && indent.endsWith(INDENT)) {
      extra = '\n' + indent.slice(0, -INDENT.length);
      const inserted = '\n' + indent + extra;
      setCode(v.slice(0, s) + inserted + v.slice(en), s + 1 + indent.length);
      return;
    }
    setCode(v.slice(0, s) + '\n' + indent + v.slice(en), s + 1 + indent.length);
    return;
  }

  // ---- 退格：光标前有成对括号/引号时，一次删两个 ----
  if (e.key === 'Backspace' && !selected) {
    const pairs = { '}': '{', ']': '[', ')': '(', '"': '"', "'": "'" };
    const before = v.slice(s - 1, s);
    const after = v.slice(s, s + 1);
    if (pairs[after] === before) {
      e.preventDefault();
      setCode(v.slice(0, s - 1) + v.slice(s + 1), s - 1);
      return;
    }
  }

  // ---- 输入开括号/引号：自动补全，光标置于中间 ----
  const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
  const close = pairs[e.key];
  if (close && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    // 选中文本时用括号包起来
    if (selected) {
      const sel = v.slice(s, en);
      setCode(v.slice(0, s) + e.key + sel + close + v.slice(en), en + close.length + 1);
    } else {
      // 光标后已是对应闭合符就不重复补
      if (v.slice(s, s + 1) === close) {
        setCode(v, s + 1);
      } else {
        setCode(v.slice(0, s) + e.key + close + v.slice(en), s + 1);
      }
    }
    return;
  }

  // ---- 输入闭合符：光标后已有该符号则跳过，不重复 ----
  const openers = { ')': '(', ']': '[', '}': '{', '"': '"', "'": "'" };
  if (openers[e.key] && !selected && v.slice(s, s + 1) === e.key) {
    e.preventDefault();
    setCode(v, s + 1);
    return;
  }
});
</script>

<div id="apkModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;align-items:center;justify-content:center;">

    <!-- 包名 -->

    <input id="apkPkg" placeholder="com.example.myapp" spellcheck="false"
      style="width:100%;padding:10px;border:1px solid #555;border-radius:8px;background:#1e1e1e;color:#e0e0e0;font-size:15px;box-sizing:border-box">
    <div style="font-size:11px;color:#777;margin-top:4px">如 com.example.myapp（至少两段，只能用字母数字和点）</div>

    <!-- 图标选择 -->
    <label style="display:block;margin:16px 0 4px;font-size:13px;color:#aaa">应用图标</label>
    <div id="iconPresets" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
      <div class="icon-opt" data-icon="default" onclick="selectIcon(this)" style="cursor:pointer;padding:8px;border:2px solid #007AFF;border-radius:8px;text-align:center;width:64px">
        <div style="font-size:28px">⚡</div>
        <div style="font-size:10px;color:#aaa">默认</div>
      </div>
      <div class="icon-opt" data-icon="game" onclick="selectIcon(this)" style="cursor:pointer;padding:8px;border:2px solid transparent;border-radius:8px;text-align:center;width:64px">
        <div style="font-size:28px">🎮</div>
        <div style="font-size:10px;color:#aaa">游戏</div>
      </div>
      <div class="icon-opt" data-icon="tool" onclick="selectIcon(this)" style="cursor:pointer;padding:8px;border:2px solid transparent;border-radius:8px;text-align:center;width:64px">
        <div style="font-size:28px">🔧</div>

        <div style="font-size:10px;color:#aaa">音乐</div>
      </div>

        <div style="font-size:28px">📁</div>
        <div style="font-size:10px;color:#aaa">自定义</div>
      </div>
    </div>
    <input type="file" id="iconFile" accept="image/*" style="display:none" onchange="loadCustomIcon(this)">

    <!-- 图标预览 -->
    <div id="iconPreview" style="display:none;margin:12px 0;text-align:center">
      <img id="iconImg" style="width:64px;height:64px;border-radius:14px;border:2px solid #555">
      <div style="font-size:11px;color:#777;margin-top:4px">图标预览</div>
    </div>

    <!-- 按钮 -->
    <div style="display:flex;gap:12px;margin-top:20px">
      <button onclick="closeApkModal()" style="flex:1;padding:12px;border:1px solid #555;border-radius:8px;background:transparent;color:#ccc;font-size:15px">取消</button>
      <button onclick="doBuildApk()" style="flex:1;padding:12px;border:none;border-radius:8px;background:#007AFF;color:#fff;font-size:15px;font-weight:600">开始打包</button>
    </div>
  </div>
</div>

<script>
let selectedIcon = 'default';
let customIconData = null;

function selectIcon(el) {
  document.querySelectorAll('.icon-opt').forEach(e => e.style.borderColor = 'transparent');
  el.style.borderColor = '#007AFF';
  selectedIcon = el.dataset.icon;
  if (selectedIcon !== 'custom') {
    document.getElementById('iconPreview').style.display = 'none';
    customIconData = null;
  }
}

function loadCustomIcon(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    customIconData = e.target.result;
    document.getElementById('iconImg').src = customIconData;
    document.getElementById('iconPreview').style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

function openApkModal() {
  const name = curName.replace(/\.(chpp|chr|px)$/, '') || 'myapp';
  document.getElementById('apkName').value = name;
  document.getElementById('apkPkg').value = pkgEl.value || 'com.example.' + name.replace(/[^a-z0-9]/gi, '').toLowerCase();
  document.getElementById('apkModal').style.display = 'flex';
}

function closeApkModal() {
  document.getElementById('apkModal').style.display = 'none';
}

function doBuildApk() {
  const name = document.getElementById('apkName').value.trim();
  const pkg = document.getElementById('apkPkg').value.trim();

  if (!name) { alert('请输入 APK 文件名'); return; }
  if (!pkg || pkg.split('.').length < 2) { alert('包名至少两段，如 com.example.myapp'); return; }
  if (!/^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/.test(pkg)) {
    alert('包名格式不正确，只能用字母数字和点，每段以字母开头');
    return;
  }

  closeApkModal();
  if (!(bridge && bridge.compileApk)) {
    alert('打包功能仅在 Android App 内可用');
    return;
  }
  if (!syntaxCheck('打包 APK')) return;

  // 传递自定义参数
  bridge.compileApkWithOptions(name, pkg, codeEl.value, selectedIcon, customIconData || '');
}
</script>
