<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chronospp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1e1e1e;color:#ccc;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}
#app{height:100%;display:flex;flex-direction:column}

/* 加载中 */
#loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading .spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#007acc;
  border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .txt{color:#858585;font-size:14px}

/* 输出终端 */
#console{flex:1;overflow-y:auto;padding:16px;font-family:'Consolas','Monaco',monospace;
  font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;display:none}
#console .err{color:#f48771}
#console .ok{color:#89d185}
#console .dim{color:#858585}

/* UI 模式 */
#uiFrame{flex:1;width:100%;border:none;display:none;background:#fff}

/* 错误提示 */
#errorBar{display:none;padding:12px 16px;background:#5a1d1d;color:#f48771;
  font-family:monospace;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app">
  <div id="loading">
    <div class="spinner"></div>
    <div class="txt">正在启动…</div>
  </div>
  <div id="console"></div>
  <div id="uiRoot" style="display:none"></div>
  <div id="errorBar"></div>
</div>

<script src="wasm_exec.js"></script>
<script>
const loadingEl = document.getElementById('loading');
const consoleEl = document.getElementById('console');
const uiRootEl = document.getElementById('uiRoot');
const errorBarEl = document.getElementById('errorBar');

function showError(msg){
  errorBarEl.style.display = 'block';
  errorBarEl.textContent = msg;
}

function appendOut(text, cls){
  consoleEl.style.display = 'block';
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  consoleEl.appendChild(span);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

// 渲染 UI：直接注入主文档（不用 iframe，避免 postMessage 时序问题）
function renderUI(html){
  loadingEl.style.display = 'none';
  consoleEl.style.display = 'none';

  // 提取 <style> 和 <body> 内容
  const styleM = html.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
  const bodyM  = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);

  // 样式（追加到 head）
  if (styleM) {
    let st = document.getElementById('chronos-ui-style');
    if (!st) {
      st = document.createElement('style');
      st.id = 'chronos-ui-style';
      document.head.appendChild(st);
    }
    st.textContent = styleM[1];
  }

  // 内容
  uiRootEl.style.display = 'block';
  uiRootEl.innerHTML = bodyM ? bodyM[1] : html;
}

// 全局回调：局部更新，避免重建 DOM 打断滑块/输入
window.chronosCallback = function(id, value){
  if (typeof window.chronosUICallback !== 'function') return;
  try {
    const raw = window.chronosUICallback(id, String(value));
    if (!raw) return;
    const res = JSON.parse(raw);

    // 1. 局部更新：只改变化元素的文字
    if (res.updates && res.updates.length > 0) {
      res.updates.forEach(function(u){
        const el = document.getElementById(u.id);
        if (!el) return;
        // checkbox 更新勾选状态
        if (el.type === 'checkbox') {
          el.checked = (u.text === 'true' || u.text === '1');
          return;
        }
        // slider 不覆盖用户拖动中的值
        if (el.type === 'range') return;
        // 其他元素更新文字
        el.textContent = u.text;
      });
    }

    // 2. 整页重绘：只有 ui.reset() 或新增元素时
    if (res.fullHtml && res.fullHtml.length > 0) {
      renderUI(res.fullHtml);
    }
  } catch (err) {
    console.error('UI callback error:', err);
  }
};

// 读脚本内容
function getScriptContent(){
  // 优先 <script id="chronos-script"> 内嵌
  const tag = document.getElementById('chronos-script');
  if (tag && tag.textContent.trim()) return tag.textContent;
  if (window.__CHRONOS_SCRIPT__) return window.__CHRONOS_SCRIPT__;
  return '';
}

// 启动 WASM（等 DOM 解析完，确保 chronos-script 元素已存在）
function startBoot(){
(async function boot(){
  const script = getScriptContent();
  if (!script.trim()) {
    loadingEl.style.display = 'none';
    showError('没有找到脚本内容');
    return;
  }

  if (typeof Go === 'undefined') {
    loadingEl.style.display = 'none';
    showError('wasm_exec.js 加载失败');
    return;
  }

  const go = new Go();

  // 虚拟文件系统（让 import 能找到本脚本）
  window.chronosFiles = { 'main.chpp': script };
  window.chronosCurrentFile = 'main.chpp';

  let wasmResult;
  try {
    wasmResult = await WebAssembly.instantiateStreaming(
      fetch('chronos.wasm'), go.importObject);
  } catch (e) {
    try {
      const buf = await (await fetch('chronos.wasm')).arrayBuffer();
      wasmResult = await WebAssembly.instantiate(buf, go.importObject);
    } catch (e2) {
      loadingEl.style.display = 'none';
      showError('WASM 加载失败: ' + e2);
      return;
    }
  }

  go.run(wasmResult.instance);

  // 等 WASM 就绪
  let tries = 0;
  while (typeof window.chronosRun !== 'function' && tries < 100) {
    await new Promise(r => setTimeout(r, 50));
    tries++;
  }
  if (typeof window.chronosRun !== 'function') {
    loadingEl.style.display = 'none';
    showError('WASM 运行时未就绪');
    return;
  }

  // 执行脚本
  let res;
  try {
    res = JSON.parse(window.chronosRun(script));
  } catch (e) {
    loadingEl.style.display = 'none';
    showError('运行时异常: ' + e);
    return;
  }

  loadingEl.style.display = 'none';

  // 有 UI 输出 → 渲染界面
  if (res.ui && res.ui.length > 0) {
    renderUI(res.ui);
    return;
  }

  // 否则显示终端输出
  if (res.output) appendOut(res.output);
  if (res.error) appendOut(res.error, 'err');
  if (!res.output && !res.error) {
    consoleEl.style.display = 'block';
    appendOut('（无输出）', 'dim');
  }
})();
}

// DOM 就绪后再启动
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startBoot);
} else {
  startBoot();
}
</script>
</body>
</html>
