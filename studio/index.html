<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronospp Studio</title>
<style>
:root{
  --bg:#1e1e1e; --bg-side:#252526; --bg-activity:#333333;
  --bg-tab:#2d2d2d; --bg-tab-active:#1e1e1e; --bg-status:#007acc;
  --bg-input:#3c3c3c; --bg-hover:#2a2d2e; --bg-sel:#264f78;
  --fg:#cccccc; --fg-dim:#858585; --fg-bright:#e7e7e7;
  --border:#3c3c3c; --accent:#007acc;
  --syn-kw:#569cd6; --syn-str:#ce9178; --syn-num:#b5cea8;
  --syn-cmt:#6a9955; --syn-fn:#dcdcaa; --syn-type:#4ec9b0;
  --syn-op:#d4d4d4; --syn-var:#9cdcfe;
  --line-h:20px; --font:13px/20px 'Consolas','Monaco','Menlo','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font);
  display:flex; flex-direction:column; user-select:none;
}

/* ── 标题栏 ───────────────────────────── */
.titlebar{
  height:35px; background:var(--bg-activity); display:flex;
  align-items:center; padding:0 12px; gap:8px; flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.titlebar .logo{
  width:18px;height:18px;border-radius:3px;background:var(--accent);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;
}
.titlebar .name{font-size:12px;color:var(--fg-dim)}
.titlebar .actions{margin-left:auto;display:flex;gap:6px}
.titlebar button{
  background:transparent;border:1px solid transparent;color:var(--fg);
  padding:3px 10px;border-radius:3px;cursor:pointer;font:inherit;font-size:12px;
}
.titlebar button:hover{background:var(--bg-hover)}
.titlebar button.primary{background:#0e639c;color:#fff}
.titlebar button.primary:hover{background:#1177bb}

/* ── 主体 ─────────────────────────────── */
.main{flex:1;display:flex;min-height:0}

/* 活动栏 */
.activity{
  width:48px;background:var(--bg-activity);display:flex;flex-direction:column;
  align-items:center;padding-top:8px;gap:4px;flex-shrink:0;
}
.activity .item{
  width:40px;height:40px;display:grid;place-items:center;cursor:pointer;
  color:var(--fg-dim);border-left:2px solid transparent;font-size:17px;
}
.activity .item:hover{color:var(--fg-bright)}
.activity .item.active{color:var(--fg-bright);border-left-color:var(--fg-bright)}

/* 侧栏 */
.sidebar{
  width:240px;background:var(--bg-side);flex-shrink:0;
  display:flex;flex-direction:column;border-right:1px solid var(--border);
}
.sidebar.hidden{display:none}
.sidebar .head{
  padding:10px 16px;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--fg-dim);flex-shrink:0;
}
.file-list{flex:1;overflow-y:auto;padding-bottom:8px}
.file-item{
  padding:4px 16px 4px 28px;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;color:var(--fg);
}
.file-item:hover{background:var(--bg-hover)}
.file-item.active{background:#37373d}
.file-item .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.file-item .dot.off{background:transparent}

/* 编辑区 */
.editor-area{flex:1;display:flex;flex-direction:column;min-width:0}

/* 标签栏 */
.tabs{
  height:35px;background:var(--bg-tab);display:flex;flex-shrink:0;
  overflow-x:auto;border-bottom:1px solid var(--border);
}
.tabs::-webkit-scrollbar{height:0}
.tab{
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--bg-tab);color:var(--fg-dim);cursor:pointer;
  font-size:13px;border-right:1px solid var(--border);white-space:nowrap;
  border-top:1px solid transparent;
}
.tab.active{background:var(--bg-tab-active);color:var(--fg-bright);border-top-color:var(--accent)}
.tab .close{
  width:16px;height:16px;display:grid;place-items:center;border-radius:3px;
  font-size:14px;line-height:1;opacity:.6;
}
.tab .close:hover{background:var(--bg-hover);opacity:1}
.tab .dirty{width:8px;height:8px;border-radius:50%;background:var(--fg-bright)}

/* 代码区 */
.editor-wrap{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
.gutter{
  width:56px;background:var(--bg);flex-shrink:0;overflow:hidden;
  padding-top:8px;text-align:right;user-select:none;
}
.gutter div{
  height:var(--line-h);line-height:var(--line-h);padding-right:14px;
  color:#5a5a5a;font-size:12px;
}
.gutter div.cur{color:var(--fg-bright)}
.code-container{flex:1;position:relative;overflow:auto}
.code-container::-webkit-scrollbar{width:12px;height:12px}
.code-container::-webkit-scrollbar-thumb{background:#424242;border-radius:6px}
.code-container::-webkit-scrollbar-track{background:var(--bg)}

/* 高亮层 + 输入层 */
#highlight, #code{
  position:absolute;top:8px;left:0;
  font:var(--font);letter-spacing:0;tab-size:4;
  padding:0 16px;margin:0;border:0;white-space:pre;
  word-wrap:normal;overflow:hidden;
}
#highlight{pointer-events:none;color:var(--fg);z-index:0}
#code{
  z-index:1;width:100%;height:100%;min-height:100%;
  background:transparent;color:transparent;caret-color:#aeafad;
  resize:none;outline:none;overflow:hidden;
}
#code::selection{background:var(--bg-sel);color:transparent}

/* 语法高亮 */
.kw{color:var(--syn-kw)}
.str{color:var(--syn-str)}
.num{color:var(--syn-num)}
.cmt{color:var(--syn-cmt);font-style:italic}
.fn{color:var(--syn-fn)}
.type{color:var(--syn-type)}
.var{color:var(--syn-var)}

/* 输出面板 */
.panel{
  height:0;background:var(--bg);border-top:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
  transition:height .12s ease;
}
.panel.open{height:200px}
.panel .panel-head{
  height:30px;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:var(--bg-side);flex-shrink:0;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;color:var(--fg-dim);
}
.panel .panel-head span{cursor:pointer;padding:6px 0}
.panel .panel-head span.active{color:var(--fg-bright);border-bottom:1px solid var(--accent)}
.panel .panel-head .spacer{flex:1}
.panel .panel-head .clear{cursor:pointer}
.panel .panel-head .clear:hover{color:var(--fg-bright)}
.output{
  flex:1;overflow-y:auto;padding:8px 16px;white-space:pre-wrap;
  word-break:break-word;font:var(--font);color:var(--fg);
}
.output::-webkit-scrollbar{width:10px}
.output::-webkit-scrollbar-thumb{background:#424242;border-radius:5px}
.output .err{color:#f48771}
.output .ok{color:#89d185}
.output .dim{color:var(--fg-dim)}

/* 状态栏 */
.statusbar{
  height:22px;background:var(--bg-status);color:#fff;display:flex;
  align-items:center;padding:0 12px;gap:16px;font-size:12px;flex-shrink:0;
}
.statusbar .right{margin-left:auto;display:flex;gap:16px}
.statusbar .clickable{cursor:pointer}
.statusbar .clickable:hover{background:rgba(255,255,255,.12)}

/* 快捷键提示 */
.hint{
  position:absolute;bottom:12px;right:16px;font-size:11px;color:#5a5a5a;
  pointer-events:none;
}
</style>
</head>
<body>

<!-- 标题栏 -->
<div class="titlebar">
  <div class="logo">C</div>
  <span class="name">Chronospp Studio</span>
  <div class="actions">
    <button id="btnRun" class="primary" title="运行 (F5)">▶ 运行</button>
    <button id="btnBuild" title="编译成可执行文件 (Ctrl+B)">编译</button>
    <button id="btnNew" title="新建文件 (Ctrl+N)">新建</button>
  </div>
</div>

<div class="main">
  <!-- 活动栏 -->
  <div class="activity">
    <div class="item active" data-view="files" title="资源管理器">📁</div>
    <div class="item" data-view="outline" title="大纲">☰</div>
    <div class="item" data-view="settings" title="设置">⚙</div>
  </div>

  <!-- 侧栏 -->
  <div class="sidebar" id="sidebar">
    <div class="head" id="sidebarTitle">资源管理器</div>
    <div class="file-list" id="fileList"></div>
  </div>

  <!-- 编辑区 -->
  <div class="editor-area">
    <div class="tabs" id="tabs"></div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter"></div>
      <div class="code-container" id="codeContainer">
        <pre id="highlight"></pre>
        <textarea id="code" spellcheck="false" autocapitalize="off"
                  autocorrect="off" wrap="off"></textarea>
      </div>
    </div>
    <!-- 输出面板 -->
    <div class="panel" id="panel">
      <div class="panel-head">
        <span class="active" data-tab="output">输出</span>
        <span data-tab="problems">问题</span>
        <div class="spacer"></div>
        <span class="clear" id="clearOutput">清空</span>
      </div>
      <div class="output" id="output"></div>
    </div>
  </div>
</div>

<!-- 状态栏 -->
<div class="statusbar">
  <span id="statusFile">未打开文件</span>
  <span id="statusPos">行 1, 列 1</span>
  <div class="right">
    <span id="statusMsg"></span>
    <span>Chronospp</span>
  </div>
</div>

<script>
// ── 状态 ──────────────────────────────
const state = {
  files: {},        // name -> content
  order: [],        // 打开顺序
  current: null,
  dirty: {},
};
const LS_KEY = 'chronospp.studio.files';
const LS_CUR = 'chronospp.studio.current';

// ── 语法高亮 ──────────────────────────
const KEYWORDS = new Set([
  'let','const','fn','if','else','elif','while','for','in','return','break',
  'continue','import','export','as','try','catch','throw','class','new','this',
  'super','true','false','nil','null','and','or','not','traveller','withSnapshot'
]);
const TYPES = new Set(['int','float','string','str','bool','void','any','array','hash']);

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(code){
  let out = '';
  let i = 0;
  const n = code.length;

  while (i < n) {
    const c = code[i];
    const rest = code.slice(i);

    // 注释 //
    if (c === '/' && code[i+1] === '/') {
      let j = code.indexOf('\n', i);
      if (j < 0) j = n;
      out += '<span class="cmt">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // 注释 /* */
    if (c === '/' && code[i+1] === '*') {
      let j = code.indexOf('*/', i+2);
      j = j < 0 ? n : j + 2;
      out += '<span class="cmt">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // 字符串
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n) {
        if (code[j] === '\\') { j += 2; continue; }
        if (code[j] === c) { j++; break; }
        if (code[j] === '\n') break;
        j++;
      }
      out += '<span class="str">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // 数字
    if (/[0-9]/.test(c) && !/[a-zA-Z_]/.test(code[i-1] || '')) {
      let j = i;
      while (j < n && /[0-9._eExXa-fA-F]/.test(code[j])) j++;
      out += '<span class="num">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // 标识符
    if (/[a-zA-Z_]/.test(c)) {
      let j = i;
      while (j < n && /[a-zA-Z0-9_]/.test(code[j])) j++;
      const word = code.slice(i, j);
      let cls = '';
      if (KEYWORDS.has(word)) cls = 'kw';
      else if (TYPES.has(word)) cls = 'type';
      else if (code[j] === '(') cls = 'fn';
      out += cls ? '<span class="' + cls + '">' + esc(word) + '</span>' : esc(word);
      i = j;
      continue;
    }
    out += esc(c);
    i++;
  }
  return out;
}

// ── DOM ───────────────────────────────
const $code = document.getElementById('code');
const $hl = document.getElementById('highlight');
const $gutter = document.getElementById('gutter');
const $tabs = document.getElementById('tabs');
const $fileList = document.getElementById('fileList');
const $output = document.getElementById('output');
const $panel = document.getElementById('panel');
const $statusFile = document.getElementById('statusFile');
const $statusPos = document.getElementById('statusPos');
const $statusMsg = document.getElementById('statusMsg');

function renderHighlight(){
  // 末尾补一个换行，避免最后一个空行不显示
  $hl.innerHTML = highlight($code.value) + '\n';
  const lines = $code.value.split('\n').length;
  const curLine = $code.value.slice(0, $code.selectionStart).split('\n').length;
  let g = '';
  for (let i = 1; i <= lines; i++){
    g += '<div class="' + (i === curLine ? 'cur' : '') + '">' + i + '</div>';
  }
  $gutter.innerHTML = g;
}

function syncScroll(){
  $hl.scrollTop = $code.scrollTop;
  $hl.scrollLeft = $code.scrollLeft;
  $gutter.scrollTop = $code.scrollTop;
  $gutter.scrollLeft = 0;
}

$code.addEventListener('scroll', syncScroll);
$code.addEventListener('input', () => {
  if (state.current){
    state.files[state.current] = $code.value;
    state.dirty[state.current] = true;
    save();
    renderTabs();
  }
  renderHighlight();
  updatePos();
});
$code.addEventListener('click', () => { renderHighlight(); updatePos(); });
$code.addEventListener('keyup', updatePos);

function updatePos(){
  const v = $code.value.slice(0, $code.selectionStart);
  const line = v.split('\n').length;
  const col = v.length - v.lastIndexOf('\n');
  $statusPos.textContent = '行 ' + line + ', 列 ' + col;
}

// ── 文件管理 ──────────────────────────
function openFile(name){
  if (!state.files[name]) state.files[name] = '';
  if (!state.order.includes(name)) state.order.push(name);
  state.current = name;
  $code.value = state.files[name];
  $statusFile.textContent = name;
  renderTabs();
  renderFiles();
  renderHighlight();
  save();
  $code.focus();
}

function closeFile(name){
  state.order = state.order.filter(f => f !== name);
  if (state.current === name){
    state.current = state.order[state.order.length - 1] || null;
    if (state.current){
      $code.value = state.files[state.current];
      $statusFile.textContent = state.current;
    } else {
      $code.value = '';
      $statusFile.textContent = '未打开文件';
    }
  }
  renderTabs();
  renderFiles();
  renderHighlight();
  save();
}

function renderTabs(){
  $tabs.innerHTML = '';
  state.order.forEach(name => {
    const d = document.createElement('div');
    d.className = 'tab' + (name === state.current ? ' active' : '');
    const dirty = state.dirty[name] ? '<span class="dirty"></span>' : '';
    d.innerHTML = dirty + '<span>' + name + '</span><span class="close">×</span>';
    d.onclick = e => {
      if (e.target.classList.contains('close')) { closeFile(name); return; }
      openFile(name);
    };
    $tabs.appendChild(d);
  });
}

function renderFiles(){
  $fileList.innerHTML = '';
  const names = Object.keys(state.files).sort();
  if (!names.length){
    $fileList.innerHTML = '<div class="file-item" style="color:#858585">还没有文件</div>';
    return;
  }
  names.forEach(name => {
    const d = document.createElement('div');
    d.className = 'file-item' + (name === state.current ? ' active' : '');
    const on = name === state.current ? '' : ' off';
    d.innerHTML = '<span class="dot' + on + '"></span>' + name;
    d.onclick = () => openFile(name);
    $fileList.appendChild(d);
  });
}

// ── 输出 ──────────────────────────────
function log(text, cls){
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  $output.appendChild(d);
  $output.scrollTop = $output.scrollHeight;
  $panel.classList.add('open');
}

function clearLog(){ $output.innerHTML = ''; }

document.getElementById('clearOutput').onclick = clearLog;

// ── 运行 / 编译 ───────────────────────
function runCode(){
  if (!state.current){ log('先打开或新建一个文件', 'err'); return; }
  clearLog();
  const name = state.current;
  log('> 运行 ' + name, 'dim');
  fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ code: $code.value, name: name })
  })
  .then(r => r.json())
  .then(data => {
    if (data.output) log(data.output);
    if (data.error) log(data.error, 'err');
    if (!data.error) log('— 完成（' + (data.ms || 0) + ' ms）', 'ok');
    setStatus(data.error ? '运行出错' : '运行成功');
  })
  .catch(e => {
    log('无法连接后端：' + e.message, 'err');
    log('提示：用 chpp serve 启动，或用桌面版', 'dim');
    setStatus('连接失败');
  });
}

function buildCode(){
  if (!state.current){ log('先打开或新建一个文件', 'err'); return; }
  clearLog();
  const name = state.current;
  log('> 编译 ' + name, 'dim');
  fetch('/api/build', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ code: $code.value, name: name })
  })
  .then(r => r.json())
  .then(data => {
    if (data.output) log(data.output);
    if (data.error) log(data.error, 'err');
    setStatus(data.error ? '编译失败' : '编译成功');
  })
  .catch(e => { log('无法连接后端：' + e.message, 'err'); });
}

function setStatus(msg){
  $statusMsg.textContent = msg;
  setTimeout(() => { $statusMsg.textContent = ''; }, 3000);
}

// ── 快捷键 ────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'F5' || (e.ctrlKey && e.key === 'Enter')){ e.preventDefault(); runCode(); }
  if (e.ctrlKey && e.key === 'b'){ e.preventDefault(); buildCode(); }
  if (e.ctrlKey && e.key === 'n'){ e.preventDefault(); newFile(); }
  if (e.ctrlKey && e.key === 's'){ e.preventDefault(); save(); setStatus('已保存'); }
  // Tab 插入空格
  if (e.key === 'Tab'){
    e.preventDefault();
    const s = $code.selectionStart, en = $code.selectionEnd;
    $code.value = $code.value.slice(0, s) + '    ' + $code.value.slice(en);
    $code.selectionStart = $code.selectionEnd = s + 4;
    $code.dispatchEvent(new Event('input'));
  }
});

// ── 侧栏切换 ──────────────────────────
document.querySelectorAll('.activity .item').forEach(item => {
  item.onclick = () => {
    document.querySelectorAll('.activity .item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const view = item.dataset.view;
    document.getElementById('sidebarTitle').textContent =
      view === 'files' ? '资源管理器' : view === 'outline' ? '大纲' : '设置';
    if (view === 'files') renderFiles();
    else if (view === 'outline') renderOutline();
    else renderSettings();
  };
});

function renderOutline(){
  $fileList.innerHTML = '';
  const code = $code.value;
  const re = /^(?:fn|int|float|string|bool|void|class)\s+([a-zA-Z_][a-zA-Z0-9_]*)/gm;
  let m, found = false;
  while ((m = re.exec(code))){
    found = true;
    const line = code.slice(0, m.index).split('\n').length;
    const d = document.createElement('div');
    d.className = 'file-item';
    d.innerHTML = '<span style="color:#4ec9b0">ƒ</span> ' + m[1] +
                  '<span style="color:#5a5a5a;margin-left:auto">' + line + '</span>';
    d.onclick = () => {
      const pos = code.slice(0, m.index).length;
      $code.focus();
      $code.setSelectionRange(pos, pos);
      const ln = code.slice(0, pos).split('\n').length;
      $code.scrollTop = (ln - 1) * 20;
      renderHighlight();
    };
    $fileList.appendChild(d);
  }
  if (!found) $fileList.innerHTML = '<div class="file-item" style="color:#858585">没有函数或类</div>';
}

function renderSettings(){
  $fileList.innerHTML = `
    <div style="padding:8px 16px;font-size:12px;color:#858585;line-height:1.9">
      <div><b style="color:#ccc">快捷键</b></div>
      <div>F5 / Ctrl+Enter　运行</div>
      <div>Ctrl+B　　　　　 编译</div>
      <div>Ctrl+N　　　　　 新建</div>
      <div>Ctrl+S　　　　　 保存</div>
      <div style="margin-top:12px"><b style="color:#ccc">说明</b></div>
      <div>文件保存在浏览器本地，刷新不丢。</div>
      <div style="margin-top:12px"><b style="color:#ccc">后端</b></div>
      <div>运行和编译需要后端：</div>
      <div style="color:#9cdcfe">chpp serve --studio</div>
    </div>`;
}

// ── 新建 / 保存 ───────────────────────
function newFile(){
  let n = 1;
  while (state.files['untitled' + n + '.chpp']) n++;
  const name = 'untitled' + n + '.chpp';
  state.files[name] = '';
  openFile(name);
}

function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state.files));
    localStorage.setItem(LS_CUR, state.current || '');
  } catch(e){}
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw) state.files = JSON.parse(raw);
    const cur = localStorage.getItem(LS_CUR);
    state.order = Object.keys(state.files);
    if (!state.order.length){
      state.files['main.chpp'] = 'fn main() {\n    print("Hello, Chronospp!")\n}\n\nmain()\n';
      state.order = ['main.chpp'];
      state.current = 'main.chpp';
    } else {
      state.current = cur && state.files[cur] ? cur : state.order[0];
    }
  } catch(e){
    state.files = {'main.chpp': 'print("Hello!")\n'};
    state.order = ['main.chpp'];
    state.current = 'main.chpp';
  }
  $code.value = state.files[state.current] || '';
  $statusFile.textContent = state.current;
  renderTabs();
  renderFiles();
  renderHighlight();
}

document.getElementById('btnRun').onclick = runCode;
document.getElementById('btnBuild').onclick = buildCode;
document.getElementById('btnNew').onclick = newFile;

load();
$code.focus();
</script>
</body>
</html>
